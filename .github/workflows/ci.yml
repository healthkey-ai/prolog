name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  neutrality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/check_neutrality.py
        env:
          NEUTRALITY_DENYLIST: ${{ secrets.NEUTRALITY_DENYLIST }}
          # Fork PRs cannot read secrets, and the guard stays advisory until the
          # NEUTRALITY_DENYLIST secret is configured for the repository.
          NEUTRALITY_ALLOW_UNSET: ${{ secrets.NEUTRALITY_DENYLIST == '' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}

  schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install jsonschema
      - run: |
          python - <<'PY'
          import json, glob, jsonschema
          for schema_path, pattern in [("schema/survey-definition.schema.json", "examples/*.json"),
                                       ("schema/theme.schema.json", "themes/*/theme.json")]:
              schema = json.load(open(schema_path))
              jsonschema.Draft202012Validator.check_schema(schema)
              for f in glob.glob(pattern):
                  jsonschema.validate(json.load(open(f)), schema, cls=jsonschema.Draft202012Validator)
                  print("ok", f)
          PY

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_DB: prolog, POSTGRES_USER: prolog, POSTGRES_PASSWORD: prolog }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U prolog" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_DB: prolog
      POSTGRES_USER: prolog
      POSTGRES_PASSWORD: prolog
      POSTGRES_HOST: localhost
      DEBUG: "true"
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest

  backend-integrated:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_DB: prolog, POSTGRES_USER: prolog, POSTGRES_PASSWORD: prolog }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U prolog" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_DB: prolog_integrated
      POSTGRES_USER: prolog
      POSTGRES_PASSWORD: prolog
      POSTGRES_HOST: localhost
      DEBUG: "true"
      PROLOG_PROFILE: integrated
      PROLOG_PARTICIPANT_MODEL: auth.User
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: uv sync --frozen
      - run: uv run pytest --no-migrations --create-db

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_DB: prolog, POSTGRES_USER: prolog, POSTGRES_PASSWORD: prolog }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U prolog" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_DB: prolog
      POSTGRES_USER: prolog
      POSTGRES_PASSWORD: prolog
      POSTGRES_HOST: localhost
      DEBUG: "true"
      CI: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - run: cd backend && uv sync --frozen
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci
      - run: cd frontend && npx playwright install --with-deps chromium
      # Playwright starts the backend before globalSetup; the readiness probe needs a migrated database.
      - run: cd backend && uv run python manage.py migrate --noinput
      - run: cd frontend && npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: frontend/test-results, retention-days: 7 }
