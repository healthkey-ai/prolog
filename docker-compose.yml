services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: prolog
      POSTGRES_USER: prolog
      # No default: a fixed public password on a published port would expose
      # every response. Set it in .env (see .env.example).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Loopback only: the app reaches db over the compose network; the host
    # mapping exists for local tools (psql, pytest against this database).
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prolog"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Full standalone deployment: backend + built runner in one image (DEP-5).
  # Mount a customer's definition and theme directories under /data.
  app:
    build: { context: ., dockerfile: docker/Dockerfile }
    profiles: ["app"]
    depends_on: { db: { condition: service_healthy } }
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: prolog
      POSTGRES_USER: prolog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      # Compose interpolates every service, profile or not, so `:?` here would
      # make the db-only `docker compose up -d` (local development) demand a
      # key it never uses; an unset or placeholder key is refused by
      # settings.py instead, and the app container exits at start.
      SECRET_KEY: ${SECRET_KEY:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8000}
      PROLOG_PUBLIC_URL: ${PROLOG_PUBLIC_URL:-http://localhost:8000}
      # On, as documented for DEBUG=false. Behind a TLS-terminating proxy set
      # PROLOG_NUM_PROXIES=1 so X-Forwarded-Proto is trusted (else it loops);
      # set false only to try the image over plain HTTP on localhost.
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-true}
      PROLOG_CLIENT_KEY_SALT: ${PROLOG_CLIENT_KEY_SALT:-${SECRET_KEY}}
      CONN_MAX_AGE: ${CONN_MAX_AGE:-60}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
      # Local zone for calendar dates (effective windows, due dates, captured_on).
      TIME_ZONE: ${TIME_ZONE:-UTC}
      # Operational settings from .env (compose only substitutes ${...}; it does
      # not pass .env into the container by itself).
      PROLOG_NUM_PROXIES: ${PROLOG_NUM_PROXIES:-0}
      PROLOG_THROTTLE_CREATE: ${PROLOG_THROTTLE_CREATE:-30/hour}
      PROLOG_THROTTLE_CAPTURE: ${PROLOG_THROTTLE_CAPTURE:-30/hour}
      PROLOG_THROTTLE_ANSWER: ${PROLOG_THROTTLE_ANSWER:-600/hour}
      PROLOG_THROTTLE_READ: ${PROLOG_THROTTLE_READ:-1200/hour}
      PROLOG_THROTTLE_WRITE: ${PROLOG_THROTTLE_WRITE:-3000/hour}
      # Throttle counters: per worker by default; see docs/deployment.md for a shared cache.
      CACHE_BACKEND: ${CACHE_BACKEND:-django.core.cache.backends.locmem.LocMemCache}
      CACHE_LOCATION: ${CACHE_LOCATION:-prolog}
      PROLOG_ABANDONED_RESPONSE_DAYS: ${PROLOG_ABANDONED_RESPONSE_DAYS:-90}
      DATA_UPLOAD_MAX_MEMORY_SIZE: ${DATA_UPLOAD_MAX_MEMORY_SIZE:-262144}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      PROLOG_EMAIL_FROM: ${PROLOG_EMAIL_FROM:-surveys@example.org}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ${PROLOG_DATA_DIR:-./examples/deploy}/surveys:/data/surveys:ro
      - ${PROLOG_DATA_DIR:-./examples/deploy}/themes:/data/themes:ro
    ports: ["8000:8000"]

volumes:
  pgdata:
