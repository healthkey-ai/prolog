services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: prolog
      POSTGRES_USER: prolog
      POSTGRES_PASSWORD: prolog
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prolog"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Full standalone deployment: backend + built runner in one image (DEP-5).
  # Mount a customer's definition and theme directories under /data.
  app:
    build: { context: ., dockerfile: docker/Dockerfile }
    profiles: ["app"]
    depends_on: { db: { condition: service_healthy } }
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: prolog
      POSTGRES_USER: prolog
      POSTGRES_PASSWORD: prolog
      # Compose interpolates every service, profile or not, so `:?` here would
      # also block the db-only `docker compose up -d`; an unset or placeholder
      # key is refused by settings.py instead, and the container exits at start.
      SECRET_KEY: ${SECRET_KEY:-}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8000}
      PROLOG_PUBLIC_URL: ${PROLOG_PUBLIC_URL:-http://localhost:8000}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-false}
      PROLOG_CLIENT_KEY_SALT: ${PROLOG_CLIENT_KEY_SALT:-${SECRET_KEY}}
      CONN_MAX_AGE: ${CONN_MAX_AGE:-60}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-3}
      # Operational settings from .env (compose only substitutes ${...}; it does
      # not pass .env into the container by itself).
      PROLOG_NUM_PROXIES: ${PROLOG_NUM_PROXIES:-0}
      PROLOG_THROTTLE_CREATE: ${PROLOG_THROTTLE_CREATE:-30/hour}
      PROLOG_THROTTLE_ANSWER: ${PROLOG_THROTTLE_ANSWER:-600/hour}
      PROLOG_THROTTLE_READ: ${PROLOG_THROTTLE_READ:-1200/hour}
      PROLOG_ABANDONED_RESPONSE_DAYS: ${PROLOG_ABANDONED_RESPONSE_DAYS:-90}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      PROLOG_EMAIL_FROM: ${PROLOG_EMAIL_FROM:-surveys@example.org}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ${PROLOG_DATA_DIR:-./examples/deploy}/surveys:/data/surveys:ro
      - ${PROLOG_DATA_DIR:-./examples/deploy}/themes:/data/themes:ro
    ports: ["8000:8000"]

volumes:
  pgdata:
