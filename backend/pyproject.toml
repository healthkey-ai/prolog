[project]
name = "prolog"
version = "0.1.0"
description = "PROlog — generic survey runner and designer for patient-reported outcomes"
# PRomop's image is python:3.12-slim and the app runs in its process, so the
# floor is PRomop's, not the newest Python. See docs/promop-migration-plan.md M0.
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    # The backend runs inside PRomop's process, so it takes PRomop's pins
    # (Django 5.2.6, DRF 3.15.2, cors 4.4.0, whitenoise 6.7.0) rather than the
    # latest stable. See docs/promop-migration-plan.md M0.
    "Django==5.2.6",
    "djangorestframework==3.15.2",
    "django-cors-headers==4.4.0",
    "psycopg[binary]>=3.3,<4",
    "jsonschema>=4.26,<5",
    "pycountry>=24.6",
    "whitenoise==6.7.0",
    "gunicorn>=23",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-django>=4.11",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prolog_surveys"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "prolog.settings_dev"
python_files = ["test_*.py"]
testpaths = ["prolog_surveys/tests"]
addopts = "-q --reuse-db"
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["E501"]
