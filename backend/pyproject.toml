[project]
name = "prolog"
version = "0.1.0"
description = "PROlog — generic survey runner and designer for patient-reported outcomes"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "Django>=6.1,<6.2",
    "djangorestframework>=3.18,<3.19",
    "django-cors-headers>=4.9,<5",
    "psycopg[binary]>=3.3,<4",
    "jsonschema>=4.26,<5",
    "pycountry>=24.6",
    "whitenoise>=6.9",
    "gunicorn>=23",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-django>=4.11",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prolog_surveys"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "prolog.settings_dev"
python_files = ["test_*.py"]
testpaths = ["prolog_surveys/tests"]
addopts = "-q --reuse-db"
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
ignore = ["E501"]
